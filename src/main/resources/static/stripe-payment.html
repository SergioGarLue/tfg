<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago con Stripe</title>
  <link rel="stylesheet" href="/estilos/login.css" />
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .payment-shell {
      width: min(520px, calc(100% - 24px));
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
      padding: 32px;
    }
    .payment-shell h1 {
      margin: 0 0 18px;
      font-size: 1.8rem;
      letter-spacing: -0.04em;
    }
    .payment-shell label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .payment-shell input,
    .payment-shell .field-group {
      width: 100%;
      margin-bottom: 16px;
    }
    .payment-shell input[type="text"],
    .payment-shell input[type="number"] {
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.82);
      color: #e2e8f0;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .payment-shell input:focus {
      border-color: #38bdf8;
    }
    #card-element {
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 14px 16px;
      min-height: 58px;
    }
    #card-errors {
      color: #f87171;
      min-height: 24px;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    #payment-result {
      color: #a7f3d0;
      min-height: 26px;
      margin-top: 16px;
      font-size: 0.98rem;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="payment-shell">
    <h1>Pagar con Stripe</h1>

    <form id="payment-form" novalidate>
      <div class="field-group">
        <label for="usuario-id">ID de usuario</label>
        <input id="usuario-id" type="number" min="1" placeholder="Ej. 1" required />
      </div>

      <div class="field-group">
        <label for="amount">Importe</label>
        <input id="amount" type="number" min="0.5" step="0.01" placeholder="9.99" required />
      </div>

      <div class="field-group">
        <label for="descripcion">Descripción</label>
        <input id="descripcion" type="text" placeholder="Pago de carrito" />
      </div>

      <div class="field-group">
        <label for="card-element">Datos de la tarjeta</label>
        <div id="card-element"></div>
      </div>

      <div id="card-errors" role="alert"></div>
      <button id="pay-button" type="submit">Pagar ahora</button>
      <div id="payment-result"></div>
    </form>
  </main>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="/js/stripe-payment.js"></script>
</body>
</html>
