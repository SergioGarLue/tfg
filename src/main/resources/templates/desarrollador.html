<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Desarrollador - Xyron</title>
  <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
  <link rel="stylesheet" href="/estilos/index.css" />
  <link rel="stylesheet" href="/estilos/desarrollador.css" />
</head>
<body>

  <div class="contenedor-principal">
    <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <div class="contenedor-busqueda">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar en la tienda...">
        </div>
        <div class="boton-carrito">
          <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
          <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <div class="panel-b2b-contenedor">
          <div class="panel-b2b-cabecera">
            <h1><i class="fa-solid fa-code"></i> Panel de Desarrollador</h1>
          </div>

          <div class="estadisticas-b2b" id="estadisticas">
            <div class="tarjeta-stat">
              <span class="valor" id="stat-total">0</span>
              <span class="etiqueta">Juegos</span>
            </div>
            <div class="tarjeta-stat">
              <span class="valor" id="stat-activos">0</span>
              <span class="etiqueta">Activos</span>
            </div>
            <div class="tarjeta-stat">
              <span class="valor" id="stat-descuentos">0</span>
              <span class="etiqueta">En oferta</span>
            </div>
          </div>

          <div class="tabla-juegos-wrapper">
            <table class="tabla-juegos">
              <thead>
                <tr>
                  <th>Juego</th>
                  <th>Precio base (€)</th>
                  <th>Descuento (%)</th>
                  <th>Precio rebajado (€)</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-juegos-body">
                <tr><td colspan="6" style="text-align:center;padding:24px;"><div class="spinner-carga"></div> Cargando juegos...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="panel-b2b-vacio" id="panel-vacio" style="display:none;">
            <i class="fa-solid fa-gamepad"></i>
            <p>No tienes juegos asociados a tu cuenta de desarrollador.</p>
          </div>
      </div>
    </main>
  </div>

  <div id="toast-b2b" class="toast-b2b"></div>

  <script src="/js/script.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
  <script src="/js/sidebar-loader.js"></script>
  <script src="/js/desarrollador.js"></script>
  <script>
    document.addEventListener('sidebarLoaded', () => {
      const devLink = document.getElementById('dev-link');
      if (devLink) devLink.classList.add('activo');
    });
  </script>
</body>
</html>
