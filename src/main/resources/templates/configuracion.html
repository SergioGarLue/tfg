<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
    <link rel="stylesheet" href="/estilos/configuracion.css" />
</head>
<body>

  <div class="contenedor-principal">
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <h1 data-lang="header-config">Configuración</h1>
      </header>

      <div class="scroll-contenido">
        <div class="contenedor-config">
          <section class="seccion-config">
            <h2 data-lang="sect-storage">Almacenamiento</h2>
            <form id="storage-form" class="form-config">
              <div class="campo-form">
                <label data-lang="lbl-storage">Ruta de instalación</label>
                <div class="ruta-input-group">
                  <input type="text" id="ruta-instalacion" readonly placeholder="Selecciona la ruta de instalación" aria-label="Ruta de instalación">
                  <button type="button" id="btn-elegir-ruta" class="btn-select" data-lang="btn-select-path">Elegir ruta</button>
                </div>
                <input type="file" id="directory-picker" webkitdirectory directory mozdirectory msdirectory hidden>
              </div>
              <button type="submit" class="btn-save" data-lang="btn-save">Guardar Cambios</button>
            </form>
          </section>

          <section class="seccion-config">
            <form class="form-config">
              <button type="button" class="btn-logout" data-lang="btn-logout">Cerrar Sesión</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Lógica de traducción
      const textos = {
        es: {
          "nav-store": "Tienda",
          "nav-collection": "Colección",
          "header-config": "Configuración",
          "sect-account": "Cuenta",
          "lbl-email": "Correo Electrónico",
          "sect-storage": "Almacenamiento",
          "lbl-storage": "Ruta de instalación",
          "btn-select-path": "Elegir ruta",
          "btn-logout": "Cerrar Sesión",
          "btn-save": "Guardar Cambios"
        },
        en: {
          "nav-store": "Store",
          "nav-collection": "Collection",
          "header-config": "Settings",
          "sect-account": "Account",
          "lbl-email": "Email Address",
          "sect-storage": "Storage",
          "lbl-storage": "Installation Path",
          "btn-select-path": "Select Path",
          "btn-logout": "Log Out",
          "btn-save": "Save Changes"
        }
      };

      const selectorIdioma = document.getElementById('idioma-select');
      if (selectorIdioma) {
        selectorIdioma.addEventListener('change', (e) => {
          const idioma = e.target.value;
          const elementos = document.querySelectorAll('[data-lang]');
          
          elementos.forEach(el => {
            const clave = el.getAttribute('data-lang');
            if (textos[idioma] && textos[idioma][clave]) {
              el.textContent = textos[idioma][clave];
            }
          });
        });
      }

      const storageKey = 'storage_installation_path';
      const rutaInput = document.getElementById('ruta-instalacion');
      const btnElegirRuta = document.getElementById('btn-elegir-ruta');
      const storageForm = document.getElementById('storage-form');

      if (rutaInput) {
        const rutaGuardada = localStorage.getItem(storageKey);
        if (rutaGuardada) {
          rutaInput.value = rutaGuardada;
        }
      }

      const directoryPickerInput = document.getElementById('directory-picker');

      const getDirectoryPathFromFile = (file) => {
        const relative = file.webkitRelativePath || file.mozRelativePath || file.relativePath;
        if (relative) {
          const parts = relative.split('/');
          return parts.length > 1 ? parts[0] : relative;
        }
        return file.name;
      };

      if (btnElegirRuta) {
        btnElegirRuta.addEventListener('click', async () => {
          if (window.showDirectoryPicker) {
            try {
              const directoryHandle = await window.showDirectoryPicker();
              rutaInput.value = directoryHandle.name;
              localStorage.setItem(storageKey, directoryHandle.name);
            } catch (error) {
              if (error.name !== 'AbortError') {
                console.error('Error seleccionando carpeta:', error);
              }
            }
            return;
          }

          if (directoryPickerInput) {
            directoryPickerInput.click();
          } else {
            alert('No se puede abrir el selector de carpetas en este navegador.');
          }
        });
      }

      if (directoryPickerInput) {
        directoryPickerInput.addEventListener('change', (event) => {
          const files = event.target.files;
          if (files.length > 0 && rutaInput) {
            rutaInput.value = getDirectoryPathFromFile(files[0]);
          }
        });
      }

      if (storageForm) {
        storageForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const ruta = rutaInput ? rutaInput.value.trim() : '';
          if (!ruta) {
            alert('Debes elegir una ruta de almacenamiento.');
            rutaInput?.focus();
            return;
          }
          localStorage.setItem(storageKey, ruta);
          alert('Ruta de almacenamiento guardada.');
        });
      }

      const logoutButton = document.querySelector('.btn-logout');
      if (logoutButton) {
        logoutButton.addEventListener('click', (event) => {
          event.preventDefault();
          logoutUsuario();
        });
      }
    });
  </script>
  <script src="/js/auth.js"></script>
  <script src='/js/script.js'></script>
</body>
</html>
