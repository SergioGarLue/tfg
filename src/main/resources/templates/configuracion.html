<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/configuracion.css" />
</head>
<body>

  <div class="contenedor-principal">
    <aside class="barra-lateral">
      <div class="zona-superior">
        <div class="logo">
          <a href="/"><i class="fa-solid fa-dragon"></i></a>
        </div>
        
        <nav>
          <ul>
            <li class="item-desplegable">
              <div class="cabecera-desplegable" id="boton-tienda">
                <a href="/tienda"><i class="fa-solid fa-store icono"></i></a>
                <span class="texto-enlace" data-lang="nav-store">Tienda</span>
              </div>
              <div class="contenedor-sublista cerrado" id="menu-tienda">
                <ul class="lista-subitems">
                  <li>Ofertas</li>
                  <li>Populares</li>
                  <li>Próximamente</li>
                </ul>
              </div>
            </li>

            <li class="item-desplegable">
              <div class="cabecera-desplegable" id="boton-coleccion">
                <a href="/coleccion"><i class="fa-solid fa-book-open icono"></i></a><span class="texto-enlace" data-lang="nav-collection">Colección</span>
              </div>
              <div class="contenedor-sublista cerrado" id="menu-coleccion">
                <ul class="lista-subitems">
                  <li>Metroidvania</li>
                  <li>Souls</li>
                  <li>Estrategia</li>
                  <li class="enlace-mas">Mostrar más <i class="fa-solid fa-chevron-down"></i></li>
                </ul>
              </div>
            </li>
          </ul>
        </nav>
      </div>

      <div class="pie-barra-lateral">
        <div class="iconos-inferiores">
          <div><i class="fa-solid fa-bell"></i></div>
          <div><i class="fa-solid fa-user"></i></div>
          <div><i class="fa-solid fa-star"></i></div>
        <div class="separador-lateral"></div>
        <div class="perfil-usuario">
          <a href="/perfil" style="text-decoration: none; color: inherit; display: contents;">
            <div class="avatar">
              <img src="https://i.pravatar.cc/150?img=11" alt="Usuario">
            </div>
            <span class="nombre-usuario">Paco Leon</span>
          </a>
          <a href="/configuracion" id="conf"><i class="fa-solid fa-gear"></i></a>
        </div>
    </aside>

    <main class="contenido">
      <header class="barra-superior">
        <h1 data-lang="header-config">Configuración</h1>
      </header>

      <div class="scroll-contenido">
        <div class="contenedor-configuracion">
          
          <section class="seccion-config">
            <h2 data-lang="sect-account">Cuenta</h2>
            <div class="grupo-form">
              <label for="email" data-lang="lbl-email">Correo Electrónico</label>
              <input type="email" id="email" value="paco.leon@example.com">
            </div>
         
          </section>

          <section class="seccion-config">
            <h2 data-lang="sect-storage">Almacenamiento</h2>
            <div class="grupo-form">
              <label for="ruta-instalacion" data-lang="lbl-storage">Ruta de instalación</label>
              <select id="ruta-instalacion">
                <option value="C:">C:\Program Files\GankMeDiddy (Default)</option>
                <option value="D:">D:\GamesLibrary</option>
                <option value="E:">E:\AlmacenamientoExterno</option>
              </select>
            </div>
          </section>

          <section class="seccion-config">
            <h2 data-lang="sect-interface">Interfaz</h2>
            <div class="grupo-form">
              <label for="idioma-select" data-lang="lbl-lang">Idioma</label>
              <select id="idioma-select">
                <option value="es">Español</option>
                <option value="en">English</option>
              </select>
            </div>
          </section>

          <div class="acciones-config">
            <button class="btn-logout" data-lang="btn-logout">Cerrar Sesión</button>
            <button class="btn-guardar" data-lang="btn-save">Guardar Cambios</button>
          </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Desplegable = (idBoton, idMenu) => {
        const boton = document.getElementById(idBoton);
        const menu = document.getElementById(idMenu);
    
        if (boton && menu) {
          boton.addEventListener("click", (e) => {
            e.preventDefault();
            menu.classList.toggle("cerrado");     
            const estaAbierto = !menu.classList.contains("cerrado");
            const items = menu.querySelectorAll("li"); 
            items.forEach((item, index) => {
              if (estaAbierto) {
                item.style.transitionDelay = `${index * 0.1}s`; 
              } else {
                item.style.transitionDelay = "0s";
              }
            });
          });
        }
      };
      Desplegable("boton-tienda", "menu-tienda");
      Desplegable("boton-coleccion", "menu-coleccion");

      // Lógica de traducción
      const textos = {
        es: {
          "nav-store": "Tienda",
          "nav-collection": "Colección",
          "header-config": "Configuración",
          "sect-account": "Cuenta",
          "lbl-email": "Correo Electrónico",
          "sect-storage": "Almacenamiento",
          "lbl-storage": "Ruta de instalación",
          "sect-interface": "Interfaz",
          "lbl-lang": "Idioma",
          "btn-logout": "Cerrar Sesión",
          "btn-save": "Guardar Cambios"
        },
        en: {
          "nav-store": "Store",
          "nav-collection": "Collection",
          "header-config": "Settings",
          "sect-account": "Account",
          "lbl-email": "Email Address",
          "sect-storage": "Storage",
          "lbl-storage": "Installation Path",
          "sect-interface": "Interface",
          "lbl-lang": "Language",
          "btn-logout": "Log Out",
          "btn-save": "Save Changes"
        }
      };

      const selectorIdioma = document.getElementById('idioma-select');
      if (selectorIdioma) {
        selectorIdioma.addEventListener('change', (e) => {
          const idioma = e.target.value;
          const elementos = document.querySelectorAll('[data-lang]');
          
          elementos.forEach(el => {
            const clave = el.getAttribute('data-lang');
            if (textos[idioma] && textos[idioma][clave]) {
              el.textContent = textos[idioma][clave];
            }
          });
        });
      }
    });
  </script>
</body>
</html>
