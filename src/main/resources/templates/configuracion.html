<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
    <link rel="stylesheet" href="/estilos/configuracion.css" />
</head>
<body>

  <div class="contenedor-principal">
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <h1 data-lang="header-config">Configuración</h1>
      </header>

      <div class="scroll-contenido">
        <div class="contenedor-config">
          <section class="seccion-config">
            <h2 data-lang="sect-account">Cuenta</h2>
            <form class="form-config">
              <div class="campo-form">
                <label data-lang="lbl-email">Correo Electrónico</label>
                <input type="email" value="paco.leon@email.com" readonly>
              </div>
              <button type="submit" class="btn-save" data-lang="btn-save">Guardar Cambios</button>
            </form>
          </section>

          <section class="seccion-config">
            <h2 data-lang="sect-storage">Almacenamiento</h2>
            <form class="form-config">
              <div class="campo-form">
                <label data-lang="lbl-storage">Ruta de instalación</label>
                <input type="text" value="C:\Games\SolarSistem">
              </div>
              <button type="submit" class="btn-save" data-lang="btn-save">Guardar Cambios</button>
            </form>
          </section>

          <section class="seccion-config">
            <h2 data-lang="sect-interface">Interfaz</h2>
            <form class="form-config">
              <div class="campo-form">
                <label data-lang="lbl-lang">Idioma</label>
                <select id="idioma-select">
                  <option value="es">Español</option>
                  <option value="en">English</option>
                </select>
              </div>
              <button type="submit" class="btn-save" data-lang="btn-save">Guardar Cambios</button>
            </form>
          </section>

          <section class="seccion-config">
            <form class="form-config">
              <button type="button" class="btn-logout" data-lang="btn-logout">Cerrar Sesión</button>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const Desplegable = (idBoton, idMenu) => {
        const boton = document.getElementById(idBoton);
        const menu = document.getElementById(idMenu);
    
        if (boton && menu) {
          boton.addEventListener("click", (e) => {
            e.preventDefault();
            menu.classList.toggle("cerrado");     
            const estaAbierto = !menu.classList.contains("cerrado");
            const items = menu.querySelectorAll("li"); 
            items.forEach((item, index) => {
              if (estaAbierto) {
                item.style.transitionDelay = `${index * 0.1}s`; 
              } else {
                item.style.transitionDelay = "0s";
              }
            });
          });
        }
      };
      Desplegable("boton-tienda", "menu-tienda");
      Desplegable("boton-coleccion", "menu-coleccion");

      // --- Lógica de Notificaciones ---
      const botonNotificaciones = document.getElementById('boton-notificaciones');
      const menuNotificaciones = document.getElementById('menu-notificaciones');

      if (botonNotificaciones && menuNotificaciones) {
        botonNotificaciones.addEventListener('click', (e) => {
          e.stopPropagation();
          menuNotificaciones.classList.toggle('activo');
        });

        document.addEventListener('click', (e) => {
          if (!menuNotificaciones.contains(e.target) && !botonNotificaciones.contains(e.target)) {
            menuNotificaciones.classList.remove('activo');
          }
        });

        const btnMarcarLeidas = menuNotificaciones.querySelector('.btn-marcar-leidas');
        if (btnMarcarLeidas) {
          btnMarcarLeidas.addEventListener('click', () => {
            const notificaciones = menuNotificaciones.querySelectorAll('.notificacion.no-leida');
            notificaciones.forEach(n => n.classList.remove('no-leida'));
          });
        }
      }

      // Lógica de traducción
      const textos = {
        es: {
          "nav-store": "Tienda",
          "nav-collection": "Colección",
          "header-config": "Configuración",
          "sect-account": "Cuenta",
          "lbl-email": "Correo Electrónico",
          "sect-storage": "Almacenamiento",
          "lbl-storage": "Ruta de instalación",
          "sect-interface": "Interfaz",
          "lbl-lang": "Idioma",
          "btn-logout": "Cerrar Sesión",
          "btn-save": "Guardar Cambios"
        },
        en: {
          "nav-store": "Store",
          "nav-collection": "Collection",
          "header-config": "Settings",
          "sect-account": "Account",
          "lbl-email": "Email Address",
          "sect-storage": "Storage",
          "lbl-storage": "Installation Path",
          "sect-interface": "Interface",
          "lbl-lang": "Language",
          "btn-logout": "Log Out",
          "btn-save": "Save Changes"
        }
      };

      const selectorIdioma = document.getElementById('idioma-select');
      if (selectorIdioma) {
        selectorIdioma.addEventListener('change', (e) => {
          const idioma = e.target.value;
          const elementos = document.querySelectorAll('[data-lang]');
          
          elementos.forEach(el => {
            const clave = el.getAttribute('data-lang');
            if (textos[idioma] && textos[idioma][clave]) {
              el.textContent = textos[idioma][clave];
            }
          });
        });
      }
    });
  </script>
  <script src='/js/script.js'></script>
</body>
</html>
