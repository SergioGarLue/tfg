<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil - Solar Sistem</title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
  <link rel="stylesheet" href="/estilos/perfil.css" />
  <style>
    /* Hide edit controls when viewing another user's profile */
    body.perfil-externo .btn-cambiar-avatar,
    body.perfil-externo #file-upload,
    body.perfil-externo #confirm-avatar {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="contenedor-principal">
    
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <div class="contenedor-busqueda">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar en la tienda...">
        </div>
        <div class="boton-carrito">
          <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
          <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <div class="contenedor-perfil">
            <div class="cabecera-perfil">
                <div class="avatar-grande">
                    <img id="avatar-preview" src="https://i.pravatar.cc/150?img=11" alt="Avatar">
                    <label for="file-upload" class="btn-cambiar-avatar">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="file-upload" accept="image/*" style="display: none;">
                    <button id="confirm-avatar" class="btn-confirmar-avatar" style="display: none;">Confirmar Cambio</button>
                </div>
                <div class="info-usuario">
                    <h1 id="perfil-nombre-usuario" class="nombre-usuario">Paco Leon</h1>
                    <p id="perfil-correo-usuario" class="correo-usuario">paco.leon@email.com</p>
                    <div class="estadisticas-usuario">
                        <div class="estadistica">
                            <span class="valor-estadistica">42</span>
                            <span class="etiqueta-estadistica">Juegos</span>
                        </div>
                        <div class="estadistica">
                            <span class="valor-estadistica">156</span>
                            <span class="etiqueta-estadistica">Amigos</span>
                        </div>
                        <div class="estadistica">
                            <span class="valor-estadistica">840</span>
                            <span class="etiqueta-estadistica">Horas</span>
                        </div>
                </div>

            <nav class="profile-nav">
                <a href="#" class="active" data-target="actividad">Última actividad</a>
                <a href="#" data-target="logros">Logros</a>
            </nav>

            <div class="contenido-secciones">
                <section id="actividad" class="profile-section active">
                    <h3>Recientes</h3>
                    <div class="actividad-reciente">
                        <div class="juego-actividad">
                            <img src="https://picsum.photos/100/60?random=1" alt="Juego">
                            <div class="info-actividad">
                                <span class="titulo-juego">Elden Ring</span>
                                <span class="detalle-actividad">Jugando ahora - 25 horas</span>
                            </div>
                        <div class="juego-actividad">
                            <img src="https://picsum.photos/100/60?random=2" alt="Juego">
                            <div class="info-actividad">
                                <span class="titulo-juego">Hollow Knight</span>
                                <span class="detalle-actividad">Completado - 60 horas</span>
                            </div>
                        <div class="juego-actividad">
                            <img src="https://picsum.photos/100/60?random=3" alt="Juego">
                            <div class="info-actividad">
                                <span class="titulo-juego">Stardew Valley</span>
                                <span class="detalle-actividad">120 horas jugadas</span>
                            </div>
                    </div>
                </section>

                <section id="logros" class="profile-section">
                    <h3>Tus Logros</h3>
                    <div class="logros-grid">
                        <div class="logro">
                            <i class="fa-solid fa-trophy"></i>
                            <span>Primer juego completado</span>
                        </div>
                        <div class="logro">
                            <i class="fa-solid fa-user-group"></i>
                            <span>10 Amigos</span>
                        </div>
                        <div class="logro">
                            <i class="fa-solid fa-gamepad"></i>
                            <span>50 Horas de juego</span>
                        </div>
                </section>
            </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      
      // Script para previsualizar y guardar imagen de perfil al seleccionarla
      const fileInput = document.getElementById('file-upload');
      const avatarPreview = document.getElementById('avatar-preview');
      const confirmButton = document.getElementById('confirm-avatar');
      let selectedImageData = null;

      if (fileInput) {
          fileInput.addEventListener('change', function(e) {
              const file = e.target.files[0];
              if (file && avatarPreview) {
                  const reader = new FileReader();
                  reader.onload = function(readerEvent) {
                      avatarPreview.src = readerEvent.target.result;
                      selectedImageData = readerEvent.target.result;
                      confirmButton.style.display = 'block'; // Show confirm button
                  }
                  reader.readAsDataURL(file);
              }
          });
      }

      if (confirmButton) {
          confirmButton.addEventListener('click', async function() {
              if (!selectedImageData) return;

              const fileInput = document.getElementById('file-upload');
              const file = fileInput.files[0];
              if (!file) return;

              const formData = new FormData();
              formData.append('avatar', file);

              try {
                  const response = await fetch('/api/perfil/avatar', {
                      method: 'PUT',
                      body: formData
                  });
                  if (response.ok) {
                      console.log('Avatar guardado en servidor');
                      // Update localStorage
                      const usuario = getUsuarioLogueado() || {};
                      usuario.imagenUsuario = selectedImageData;
                      saveUsuarioLogueado(usuario);
                      confirmButton.style.display = 'none'; // Hide confirm button
                      selectedImageData = null;
                      alert('Avatar actualizado correctamente');
                  } else {
                      const errorText = await response.text();
                      alert('Error al guardar avatar: ' + errorText);
                  }
              } catch (error) {
                  console.error('Error saving avatar:', error);
                  alert('Error al guardar avatar');
              }
          });
      }

      // Script para las pestañas del perfil
      const navLinks = document.querySelectorAll('.profile-nav a');
      const sections = document.querySelectorAll('.profile-section');

      navLinks.forEach(link => {
          link.addEventListener('click', function(e) {
              e.preventDefault();

              navLinks.forEach(navLink => navLink.classList.remove('active'));
              this.classList.add('active');

              const targetId = this.getAttribute('data-target');

              sections.forEach(section => {
                  section.classList.toggle('active', section.id === targetId);
              });
          });
      });
    });
  </script>
  <!-- Scripts de autenticación JWT -->
  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
  <script src='/js/script.js'></script>
</body>
</html>
