<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <div class="logo">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <h1>LOGIN</h1>
                <p class="subtitle">Tu plataforma de juegos</p>
            </div>

            <form class="login-form" th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    </div>
                </div>

                <div class="error-message" th:if="${param.error}">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Nombre de usuario o contraseña incorrectos</span>
                </div>

                <div class="error-message logout-message" th:if="${param.logout}">
                    <i class="fa-solid fa-check-circle"></i>
                    <span>Sesión cerrada correctamente</span>
                </div>

                <button type="submit" class="btn-login">INICIAR SESIÓN</button>
            </form>

            <div class="register-link">
                <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
            </div>
        </div>

        <div class="background-glow"></div>
    </div>
</body>
</html>
