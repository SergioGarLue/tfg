<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-section">
                <div class="logo">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <h1>LOGIN</h1>
                <p class="subtitle">Tu plataforma de juegos</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    </div>
                </div>

                <div id="error-message" class="error-message" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text"></span>
                </div>

                <div id="logout-message" class="error-message logout-message" style="display: none;">
                    <i class="fa-solid fa-check-circle"></i>
                    <span>Sesión cerrada correctamente</span>
                </div>

                <button type="submit" class="btn-login">INICIAR SESIÓN</button>
            </form>

            <div class="register-link">
                <p>¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
            </div>
        </div>

        <div class="background-glow"></div>
    </div>

    <!-- Scripts de autenticación -->
    <script src="/js/auth.js"></script>
    <script src="/js/fetch-interceptor.js"></script>
    <script src="/js/route-protection.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si se viene de logout
            const params = new URLSearchParams(window.location.search);
            if (params.has('logout')) {
                document.getElementById('logout-message').style.display = 'flex';
            }

            // Si ya está autenticado, redirigir a inicio
            if (AUTH.isAuthenticated()) {
                window.location.href = '/';
            }

            // Manejar el formulario de login
            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                const errorDiv = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                try {
                    // Limpiar error anterior
                    errorDiv.style.display = 'none';
                    errorText.textContent = '';

                    // Llamar a la función de login
                    const usuario = await AUTH.login(username, password);
                    console.log('Login exitoso:', usuario);

                    // Redirigir a la página de inicio
                    window.location.href = '/';
                } catch (error) {
                    console.error('Error en login:', error);
                    errorDiv.style.display = 'flex';
                    errorText.textContent = error.message || 'Usuario o contraseña incorrectos';
                }
            });
        });
    </script>
</body>
</html>
