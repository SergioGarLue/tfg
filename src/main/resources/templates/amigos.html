<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Amigos - Xyron</title>
  <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
  <link rel="stylesheet" href="/estilos/index.css" />
  <link rel="stylesheet" href="/estilos/amigos.css" />
</head>
<body>

  <div class="contenedor-principal">
    <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <div class="contenedor-busqueda">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar amigos...">
        </div>
        <div class="boton-carrito">
          <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
          <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <section class="seccion-amigos">
          <h2>Mis Amigos</h2>

          <!-- Buscador de usuarios -->
          <div class="buscar-amigos">
            <i class="fa-solid fa-search"></i>
            <input type="text" placeholder="Buscar por nombre de usuario...">
            <button class="btn-buscar">Buscar</button>
          </div>

          <!-- Solicitudes pendientes -->
          <div class="seccion-solicitudes">
            <h3>Solicitudes pendientes</h3>
            <div id="contenedor-solicitudes" class="lista-solicitudes">
              <p class="sin-solicitudes">Cargando solicitudes...</p>
            </div>
          </div>

          <!-- Lista de amigos (dinámica) -->
          <div class="seccion-tarjetas-amigos">
            <p class="sin-amigos">Cargando amigos...</p>
          </div>

        </section>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
  <script src='/js/script.js'></script>

  <script src="/js/amigos.js"></script>
</body>
</html>
