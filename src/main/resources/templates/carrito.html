<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
    <script src="https://js.stripe.com/v3/"></script>
    <script>
      // Configuración de Stripe
      const stripePublishableKey = 'pk_test_51TMrrrIb8MnvXMnGCxTXQKV35JpANjDfGEWjYLJdzimX70cACNpLvIMkDE02YRy36ozQ09X1LkOTXTlEGMOl0JVt00iRjprsD4'; // Clave pública de Stripe
      const stripe = Stripe(stripePublishableKey);
    </script>
  </head>
  <body>

    <div class="contenedor-principal">

          <div id="sidebar-container"></div>

      <main class="contenido">
        <header class="barra-superior">
          
          <div class="boton-carrito">
            <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
            <span class="contador-carrito" id="badge-carrito">0</span>
          </div>
        </header>

        <div class="scroll-contenido">
          <section class="seccion-carrito">
            <h2>Carrito</h2>

            <div class="lista-productos">
              <!-- Se llena dinámicamente -->
            </div>

            <div class="zona-pago">
              <div class="total-resumen">
                <span class="etiqueta-total">Total:</span>
                <span class="valor-total">0€</span>
              </div>
              <button class="boton-ir-pago">Ir al pago</button>
            </div>

          </section>
        </div>

      </main>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const CARRITO_KEY = 'solarSistemCart';
      let currentGamesMap = {};

      function normalizePrice(price) {
        const p = Number(price) || 0;
        if (p >= 100 && Number.isInteger(p)) {
          return p / 100;
        }
        return p;
      }

      function getCart() {
        return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      }

      function saveCart(cart) {
        localStorage.setItem(CARRITO_KEY, JSON.stringify(cart));
        updateBadges();
      }

      function updateBadges() {
        const totalItems = getCart().length;
        document.querySelectorAll('#badge-carrito').forEach(badge => {
          if (totalItems > 0) {
            badge.style.display = 'flex';
            badge.textContent = totalItems;
          } else {
            badge.style.display = 'none';
          }
        });
      }

      function removeFromCart(appid) {
        let cart = getCart();
        cart = cart.filter(item => item.appid !== appid);
        saveCart(cart);
        renderCart();
      }

      // Obtener precio efectivo de un juego (consulta el mapa cargado del backend)
      function getPrecioEfectivo(appid) {
        const juego = currentGamesMap[appid];
        if (!juego) return null;
        if (juego.disponible === false) return 0;
        if (juego.precioRebajado != null && juego.precioRebajado > 0) {
          return juego.precioRebajado;
        }
        return juego.precio || 0;
      }

      function getGameInfo(appid) {
        const juego = currentGamesMap[appid];
        if (!juego) return null;
        return {
          titulo: juego.titulo || 'Juego',
          imagen: juego.imagen || juego.header_image || 'https://picsum.photos/120/70?random=20',
          precioOriginal: juego.precio || 0,
          precioRebajado: juego.precioRebajado,
          porcentaje: juego.porcentaje || 0,
          disponible: juego.disponible !== false
        };
      }

      async function fetchCurrentGames() {
        try {
          const response = await fetch('/api/tienda');
          if (!response.ok) return;
          const juegos = await response.json();
          currentGamesMap = {};
          juegos.forEach(g => {
            const id = g.idJuego || g.appid || g.id;
            if (id) currentGamesMap[id] = g;
          });
        } catch (e) {
          console.warn('No se pudieron cargar precios actuales:', e);
        }
      }

      async function renderCart() {
        const listaProductos = document.querySelector('.lista-productos');
        const valorTotal = document.querySelector('.valor-total');
        const cart = getCart();

        if (cart.length === 0) {
          listaProductos.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">Carrito vacío</p>';
          valorTotal.textContent = '0€';
          return;
        }

        // Sincronizar precios con backend
        await fetchCurrentGames();

        // Actualizar cart con datos frescos
        const updatedCart = cart.map(item => {
          const info = getGameInfo(item.appid);
          if (info) {
            const precioActual = getPrecioEfectivo(item.appid);
            return {
              ...item,
              name: info.titulo,
              header_image: info.imagen,
              finalPrice: precioActual,
              precioOriginal: info.precioOriginal,
              precioRebajado: info.precioRebajado,
              porcentaje: info.porcentaje,
              disponible: info.disponible
            };
          }
          return item;
        });

        // Guardar actualizaciones en localStorage
        saveCart(updatedCart);

        listaProductos.innerHTML = updatedCart.map(item => {
          const precio = normalizePrice(item.finalPrice);
          const tieneDescuento = item.porcentaje > 0 || (item.precioRebajado != null && item.precioRebajado > 0 && item.precioRebajado < item.precioOriginal);
          const precioOriginalDisplay = tieneDescuento  ? `<span style="text-decoration: line-through; color: #888; font-size: 0.85rem; margin-right: 6px;">${normalizePrice(item.precioOriginal).toFixed(2)}€</span>` : '';
          const badgeDescuento = item.porcentaje > 0 && normalizePrice(item.finalPrice) < 0 ? `<span style="background: #76b900; color: #000; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-right: 6px;">-${item.porcentaje}%</span>` : '';
          const noDisponible = item.disponible === false ? '<span style="color: #ff3b30; font-size: 0.8rem; display: block;">No disponible</span>' : '';

          return `
            <div class="item-carrito">
              <div class="imagen-producto" style="background-image: url('${item.header_image || 'https://picsum.photos/120/70?random=20'}');"></div>
              <div class="info-producto">
                <span class="nombre-juego">${item.name}</span>
              </div>
              <button class="btn-eliminar" onclick="removeFromCart(${item.appid})"><i class="fa-solid fa-trash"></i></button>
              <div class="precio-producto">
                ${badgeDescuento}${precioOriginalDisplay}${precio.toFixed(2)}€
              </div>
            </div>
          `;
        }).join('');

        const total = updatedCart.reduce((sum, item) => sum + normalizePrice(item.finalPrice), 0);
        valorTotal.textContent = `${total.toFixed(2)}€`;
      }

      window.removeFromCart = removeFromCart;

      // Función para enviar el carrito al checkout
      async function sendToCheckout() {
        const cart = getCart();

        if (cart.length === 0) {
          alert('El carrito está vacío');
          return;
        }

        // Obtener usuario autenticado
        const usuario = typeof AUTH !== 'undefined' && AUTH ? AUTH.getAuthenticatedUser() : null;
        if (!usuario || !usuario.idUsuario) {
          alert('Debes iniciar sesión para realizar el pago');
          window.location.href = '/login';
          return;
        }
        const usuarioId = usuario.idUsuario;

        // Sincronizar precios antes de checkout
        await fetchCurrentGames();

        // Calcular el total con precios actualizados
        const total = cart.reduce((sum, item) => {
          const precioActual = getPrecioEfectivo(item.appid);
          return sum + normalizePrice(precioActual != null ? precioActual : item.finalPrice);
        }, 0);
        console.log('💰 Total del carrito: ' + total.toFixed(2) + '€');

        // Extraer ID de cada juego (cantidad siempre 1)
        const productos = cart.map(item => ({
          juegoId: item.appid,
          cantidad: 1
        }));

        // *** SI EL CARRITO ES GRATUITO ***
        if (total === 0 || total < 0.01) {
          console.log('🎁 Carrito gratuito detectado - añadiendo juegos a colección');

          const datos = {
            usuarioId: usuarioId,
            productos: productos
          };
          
          try {
            const response = await fetch('/api/v1/coleccion/add-gratis', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(datos)
            });
            
            if (!response.ok) {
              throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const data = await response.json();
            console.log('✅ Juegos añadidos a colección:', data);
            
            // Limpiar carrito
            localStorage.removeItem('solarSistemCart');
            alert('✨ ¡Juegos añadidos a tu colección!');
            
            // Recargar página
            window.location.reload();
          } catch (error) {
            console.error('❌ Error al añadir juegos gratuitos:', error);
            alert('Error: ' + error.message);
          }
          return;
        }
        
        // *** SI TIENE COSTO, PROCESAR CON STRIPE ***
        const datos = {
          usuarioId: usuarioId,
          productos: productos,
          successUrl: window.location.origin + '/success',
          cancelUrl: window.location.origin + '/carrito'
        };
        
        console.log('📦 Carrito contiene ' + cart.length + ' juego(s)');
        console.log('📦 Datos enviados al backend:');
        console.log(JSON.stringify(datos, null, 2));
        console.log('📦 Detalles del carrito:');
        cart.forEach(item => {
          const precioActual = getPrecioEfectivo(item.appid);
          console.log(`  - ${item.name} (ID: ${item.appid}): ${precioActual != null ? precioActual.toFixed(2) : item.finalPrice}€`);
        });
        
        try {
          const response = await fetch('/api/v1/payments/create-checkout-session-v2', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(datos)
          });
          
          if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
          }
          
          const data = await response.json();
          console.log('✅ Respuesta del servidor:', data);
          
          // Redirigir a la URL de pago
          if (data.url) {
            console.log('🔄 Redirigiendo a Stripe:', data.url);
            window.location.href = data.url;
          } else if (data.sessionId) {
            // Alternativa con Stripe.redirectToCheckout
            const result = await stripe.redirectToCheckout({
              sessionId: data.sessionId
            });
            
            if (result.error) {
              alert('Error de Stripe: ' + result.error.message);
            }
          } else {
            alert('Respuesta del servidor incompleta');
          }
        } catch (error) {
          console.error('❌ Error al procesar el pago:', error);
          alert('Error: ' + error.message);
        }
      }
      
      // Exponer la función globalmente
      window.sendToCheckout = sendToCheckout;
      
      // Event listener para el botón de pago
      document.querySelector('.boton-ir-pago').addEventListener('click', sendToCheckout);
      
      // Init
      updateBadges();
      renderCart();

    });
  </script>
  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
    <script src='/js/script.js'></script>
</body>
</html>
