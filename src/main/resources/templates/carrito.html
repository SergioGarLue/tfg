<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
    <script src="https://js.stripe.com/v3/"></script>
    <script>
      // Configuración de Stripe - Reemplaza con tu clave pública real
      const stripePublishableKey = 'pk_test_51TMrrrIb8MnvXMnGCxTXQKV35JpANjDfGEWjYLJdzimX70cACNpLvIMkDE02YRy36ozQ09X1LkOTXTlEGMOl0JVt00iRjprsD4'; // Clave pública de Stripe
      const stripe = Stripe(stripePublishableKey);
      
      // Asumiendo que el usuarioId está disponible (puedes obtenerlo de localStorage, una variable global, o un endpoint)
      const usuarioId = 1; // Reemplaza con el ID real del usuario logueado
    </script>
  </head>
  <body>

    <div class="contenedor-principal">

          <div id="sidebar-container"></div>

      <main class="contenido">
        <header class="barra-superior">
          <div class="contenedor-busqueda">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar en la tienda...">
          </div>
          <div class="boton-carrito">
            <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
            <span class="contador-carrito" id="badge-carrito">0</span>
          </div>
        </header>

        <div class="scroll-contenido">
          <section class="seccion-carrito">
            <h2>Carrito</h2>

            <div class="lista-productos">

              <div class="item-carrito">
                <div class="imagen-producto"
                  style="background-image: url('https://picsum.photos/120/70?random=20');"></div>
                <div class="info-producto">
                  <span class="nombre-juego">Bigger hunter</span>
                </div>
                <button class="btn-eliminar"><i
                    class="fa-solid fa-trash"></i></button>
                <div class="precio-producto">59.99€</div>
              </div>

              <div class="item-carrito">
                <div class="imagen-producto"
                  style="background-image: url('https://picsum.photos/120/70?random=21');"></div>
                <div class="info-producto">
                  <span class="nombre-juego">Femboys love</span>
                </div>
                <button class="btn-eliminar"><i
                    class="fa-solid fa-trash"></i></button>
                <div class="precio-producto">39.99€</div>
              </div>

            </div>

            <div class="zona-pago">
              <div class="total-resumen">
                <span class="etiqueta-total">Total:</span>
                <span class="valor-total">99,98€</span>
              </div>
              <button class="boton-ir-pago">Ir al pago</button>
            </div>

          </section>
        </div>

      </main>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Carrito funcional con localStorage
      const CARRITO_KEY = 'solarSistemCart';
      
      function getCart() {
        return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      }
      
      function saveCart(cart) {
        localStorage.setItem(CARRITO_KEY, JSON.stringify(cart));
        updateBadges();
      }
      
      function updateBadges() {
        const totalItems = getCart().length; // Contar solo items, no cantidad
        document.querySelectorAll('#badge-carrito').forEach(badge => {
          if (totalItems > 0) {
            badge.style.display = 'flex';
            badge.textContent = totalItems;
          } else {
            badge.style.display = 'none';
          }
        });
      }
      
      function removeFromCart(appid) {
        let cart = getCart();
        cart = cart.filter(item => item.appid !== appid);
        saveCart(cart);
        renderCart();
      }
      
      function renderCart() {
        const listaProductos = document.querySelector('.lista-productos');
        const valorTotal = document.querySelector('.valor-total');
        const cart = getCart();
        
        if (cart.length === 0) {
          listaProductos.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">Carrito vacío</p>';
          valorTotal.textContent = '0€';
          return;
        }
        
        listaProductos.innerHTML = cart.map(item => `
          <div class="item-carrito">
            <div class="imagen-producto" style="background-image: url('${item.header_image || 'https://picsum.photos/120/70?random=20'}');"></div>
            <div class="info-producto">
              <span class="nombre-juego">${item.name}</span>
              <div style="margin-top: 0.5rem; font-size: 0.9rem; color: #999;">
                Cantidad: 1
              </div>
            </div>
            <button class="btn-eliminar" onclick="removeFromCart(${item.appid})"><i class="fa-solid fa-trash"></i></button>
            <div class="precio-producto">${item.finalPrice.toFixed(2)}€</div>
          </div>
        `).join('');
        
        const total = cart.reduce((sum, item) => sum + item.finalPrice, 0);
        valorTotal.textContent = `${total.toFixed(2)}€`;
      }
      
      window.removeFromCart = removeFromCart;
      
      // Función para enviar el carrito al checkout
      async function sendToCheckout() {
        const cart = getCart();
        
        if (cart.length === 0) {
          alert('El carrito está vacío');
          return;
        }
        
        // Calcular el total
        const total = cart.reduce((sum, item) => sum + item.finalPrice, 0);
        console.log('💰 Total del carrito: ' + total.toFixed(2) + '€');
        
        // Extraer ID de cada juego (cantidad siempre 1)
        const productos = cart.map(item => ({
          juegoId: item.appid,
          cantidad: 1
        }));
        
        // *** SI EL CARRITO ES GRATUITO ***
        if (total === 0 || total < 0.01) {
          console.log('🎁 Carrito gratuito detectado - añadiendo juegos a colección');
          
          const datos = {
            usuarioId: usuarioId,
            productos: productos
          };
          
          try {
            const response = await fetch('/api/v1/coleccion/add-gratis', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(datos)
            });
            
            if (!response.ok) {
              throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const data = await response.json();
            console.log('✅ Juegos añadidos a colección:', data);
            
            // Limpiar carrito
            localStorage.removeItem('solarSistemCart');
            alert('✨ ¡Juegos añadidos a tu colección!');
            
            // Recargar página
            window.location.reload();
          } catch (error) {
            console.error('❌ Error al añadir juegos gratuitos:', error);
            alert('Error: ' + error.message);
          }
          return;
        }
        
        // *** SI TIENE COSTO, PROCESAR CON STRIPE ***
        const datos = {
          usuarioId: usuarioId,
          productos: productos,
          successUrl: window.location.origin + '/success',
          cancelUrl: window.location.origin + '/carrito'
        };
        
        console.log('📦 Carrito contiene ' + cart.length + ' juego(s)');
        console.log('📦 Datos enviados al backend:');
        console.log(JSON.stringify(datos, null, 2));
        console.log('📦 Detalles del carrito:');
        cart.forEach(item => {
          console.log(`  - ${item.name} (ID: ${item.appid}): ${item.finalPrice}€`);
        });
        
        try {
          const response = await fetch('/api/v1/payments/create-checkout-session-v2', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(datos)
          });
          
          if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
          }
          
          const data = await response.json();
          console.log('✅ Respuesta del servidor:', data);
          
          // Redirigir a la URL de pago
          if (data.url) {
            console.log('🔄 Redirigiendo a Stripe:', data.url);
            window.location.href = data.url;
          } else if (data.sessionId) {
            // Alternativa con Stripe.redirectToCheckout
            const result = await stripe.redirectToCheckout({
              sessionId: data.sessionId
            });
            
            if (result.error) {
              alert('Error de Stripe: ' + result.error.message);
            }
          } else {
            alert('Respuesta del servidor incompleta');
          }
        } catch (error) {
          console.error('❌ Error al procesar el pago:', error);
          alert('Error: ' + error.message);
        }
      }
      
      // Exponer la función globalmente
      window.sendToCheckout = sendToCheckout;
      
      // Event listener para el botón de pago
      document.querySelector('.boton-ir-pago').addEventListener('click', sendToCheckout);
      
      // Init
      updateBadges();
      renderCart();

    });
  </script>
  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
    <script src='/js/script.js'></script>
</body>
</html>
