<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
  </head>
  <body>

    <div class="contenedor-principal">

          <div id="sidebar-container"></div>

      <main class="contenido">
        <header class="barra-superior">
          <div class="contenedor-busqueda">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar en la tienda...">
          </div>
          <div class="boton-carrito">
            <a href="carrito"><i class="fa-solid fa-cart-shopping"></i></a>
            <span class="contador-carrito" id="badge-carrito">0</span>
          </div>
        </header>

        <div class="scroll-contenido">
          <section class="seccion-carrito">
            <h2>Carrito</h2>

            <div class="lista-productos">

              <div class="item-carrito">
                <div class="imagen-producto"
                  style="background-image: url('https://picsum.photos/120/70?random=20');"></div>
                <div class="info-producto">
                  <span class="nombre-juego">Bigger hunter</span>
                </div>
                <button class="btn-eliminar"><i
                    class="fa-solid fa-trash"></i></button>
                <div class="precio-producto">59.99€</div>
              </div>

              <div class="item-carrito">
                <div class="imagen-producto"
                  style="background-image: url('https://picsum.photos/120/70?random=21');"></div>
                <div class="info-producto">
                  <span class="nombre-juego">Femboys love</span>
                </div>
                <button class="btn-eliminar"><i
                    class="fa-solid fa-trash"></i></button>
                <div class="precio-producto">39.99€</div>
              </div>

            </div>

            <div class="zona-pago">
              <div class="total-resumen">
                <span class="etiqueta-total">Total:</span>
                <span class="valor-total">99,98€</span>
              </div>
              <button class="boton-ir-pago">Ir al pago</button>
            </div>

          </section>
        </div>

      </main>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Carrito funcional con localStorage
      const CARRITO_KEY = 'solarSistemCart';
      
      function getCart() {
        return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      }
      
      function saveCart(cart) {
        localStorage.setItem(CARRITO_KEY, JSON.stringify(cart));
        updateBadges();
      }
      
      function updateBadges() {
        const totalItems = getCart().reduce((sum, item) => sum + item.quantity, 0, 0);
        document.querySelectorAll('#badge-carrito').forEach(badge => {
          if (totalItems > 0) {
            badge.style.display = 'flex';
            badge.textContent = totalItems;
          } else {
            badge.style.display = 'none';
          }
        });
      }
      
      function removeFromCart(appid) {
        let cart = getCart();
        cart = cart.filter(item => item.appid !== appid);
        saveCart(cart);
        renderCart();
      }
      
      function renderCart() {
        const listaProductos = document.querySelector('.lista-productos');
        const valorTotal = document.querySelector('.valor-total');
        const cart = getCart();
        
        if (cart.length === 0) {
          listaProductos.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">Carrito vacío</p>';
          valorTotal.textContent = '0€';
          return;
        }
        
        listaProductos.innerHTML = cart.map(item => `
          <div class="item-carrito">
            <div class="imagen-producto" style="background-image: url('${item.header_image || 'https://picsum.photos/120/70?random=20'}');"></div>
            <div class="info-producto">
              <span class="nombre-juego">${item.name}</span>
              <div style="margin-top: 0.5rem;">
                <button onclick="changeQuantity(${item.appid}, -1)" style="padding: 0.25rem 0.5rem; font-size: 0.9rem; margin-right: 0.5rem;">-</button>
                <span style="font-weight: bold; margin: 0 0.5rem;">${item.quantity}</span>
                <button onclick="changeQuantity(${item.appid}, 1)" style="padding: 0.25rem 0.5rem; font-size: 0.9rem;">+</button>
              </div>
            </div>
            <button class="btn-eliminar" onclick="removeFromCart(${item.appid})"><i class="fa-solid fa-trash"></i></button>
            <div class="precio-producto">${(item.finalPrice * item.quantity).toFixed(2)}€</div>
          </div>
        `).join('');
        
        const total = cart.reduce((sum, item) => sum + (item.finalPrice * item.quantity), 0);
        valorTotal.textContent = `${total.toFixed(2)}€`;
      }
      
      window.changeQuantity = function(appid, delta) {
        let cart = getCart();
        const item = cart.find(i => i.appid === appid);
        if (item) {
          item.quantity += delta;
          if (item.quantity <= 0) {
            cart = cart.filter(i => i.appid !== appid);
          } else {
            saveCart(cart);
          }
          renderCart();
        }
      };
      
      window.removeFromCart = removeFromCart;
      
      // Init
      updateBadges();
      renderCart();

    });
  </script>
    <script src='/js/script.js'></script>
</body>
</html>
