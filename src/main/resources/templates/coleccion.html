<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección</title>
      <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
    <link rel="stylesheet" href="/estilos/coleccion.css" />
</head>
<body>

  <div class="contenedor-principal">
    
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <div class="contenedor-busqueda">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar en tu colección...">
        </div>
        <div class="boton-carrito">
           <a href="/carrito"><i class="fa-solid fa-cart-shopping"></i></a>
           <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <section class="seccion-juegos-completa">
          <div class="seccion-categoria">
             <h3>Tus juegos</h3>
          </div>
        
          <div class="cuadricula-grande" id="coleccion-juegos">
            <!-- Los juegos se cargarán dinámicamente desde el JSON -->
          </div>
        </section>
      </div>

    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let juegosColeccion = []; // Guardar los juegos para búsqueda
      const searchInput = document.querySelector('.contenedor-busqueda input');

      // --- Cargar juegos de la colección del usuario ---
      const cargarColeccionJuegos = async () => {
        try {
          // Obtener el usuario autenticado
          const usuario = typeof AUTH !== 'undefined' && AUTH ? AUTH.getAuthenticatedUser() : null;
          
          if (!usuario || !usuario.idUsuario) {
            console.error('Usuario no autenticado o sin ID');
            const contenedor = document.getElementById('coleccion-juegos');
            if (contenedor) {
              contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #a09ba6;">No estás autenticado</p>';
            }
            return;
          }

          console.log('Cargando colección para usuario:', usuario.idUsuario);
          
          // Cargar los juegos de la colección desde el backend
          const response = await fetch(`/api/coleccion/${usuario.idUsuario}`);
          
          if (response.status === 404) {
            const contenedor = document.getElementById('coleccion-juegos');
            if (contenedor) {
              contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #a09ba6;">No tienes juegos en tu colección</p>';
            }
            return;
          }

          if (!response.ok) throw new Error("Error al cargar la colección");
          
          const juegos = await response.json();
          console.log('Juegos en colección:', juegos.length);
          
          // Guardar los juegos para búsqueda
          juegosColeccion = juegos;
          
          // Renderizar los juegos
          renderizarColeccion(juegos);

          // Configurar búsqueda
          if (searchInput) {
            searchInput.addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase();
              const juegosFilltrados = juegosColeccion.filter(juego => 
                (juego.titulo || juego.name || '').toLowerCase().includes(query)
              );
              renderizarColeccion(juegosFilltrados);
            });
          }
        } catch (error) {
          console.error("Error al cargar la colección:", error);
          const contenedor = document.getElementById('coleccion-juegos');
          if (contenedor) {
            contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #ff6b6b;">Error al cargar la colección</p>';
          }
        }
      };

      const renderizarColeccion = (juegos) => {
        const contenedor = document.getElementById('coleccion-juegos');
        if (!contenedor) return;

        if (juegos.length === 0) {
          contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #a09ba6;">No se encontraron juegos</p>';
          return;
        }

        contenedor.innerHTML = '';
        juegos.forEach(juego => {
          const imagenUrl = juego.imagen || `https://via.placeholder.com/300x200`;
          const tarjeta = document.createElement('div');
          tarjeta.className = 'tarjeta';
          tarjeta.innerHTML = `
            <img src="${imagenUrl}" alt="${juego.titulo}">
            <div class="info-tarjeta">
              <span class="titulo-juego">${juego.titulo}</span>
              <div class="etiquetas">Instalado</div>
              <button class="boton-jugar" onclick="alert('Iniciando juego...')">Jugar</button>
            </div>
          `;
          contenedor.appendChild(tarjeta);
        });
      };
      
      // Llamar la función
      cargarColeccionJuegos();

      // Lógica del Carrito
      const actualizarContadorCarrito = (cantidad) => {
        const badge = document.getElementById('badge-carrito');
        if (badge) {
          if (cantidad > 0) {
            badge.style.display = 'flex'; badge.textContent = cantidad;
          } else {
            badge.style.display = 'none';
          }
        }
      };
      
      // Obtener cantidad de items del carrito (solo contar items, no cantidad)
      const CARRITO_KEY = 'solarSistemCart';
      const cart = JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      const itemsEnCarrito = cart.length;
      actualizarContadorCarrito(itemsEnCarrito);

    });
  </script>
  <script src="/js/auth.js"></script>
  <script src="/js/fetch-interceptor.js"></script>
  <script src="/js/route-protection.js"></script>
  <script src='/js/script.js'></script>
</body>
</html>
