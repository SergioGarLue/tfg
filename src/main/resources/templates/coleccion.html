<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección</title>
      <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/index.css" />
</head>
<body>

  <div class="contenedor-principal">
    
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior">
        <div class="contenedor-busqueda">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar en tu colección...">
        </div>
        <div class="boton-carrito">
           <a href="/carrito"><i class="fa-solid fa-cart-shopping"></i></a>
           <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <section class="seccion-juegos-completa">
          <div class="seccion-categoria">
             <h3>Tus juegos</h3>
          </div>
        
          <div class="cuadricula-grande" id="coleccion-juegos">
            <!-- Los juegos se cargarán dinámicamente desde el JSON -->
          </div>
        </section>
      </div>

    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // --- Cargar juegos para la colección ---
      const cargarColeccionJuegos = async () => {
        try {
          const response = await fetch('JSON/steam_top_1000_sellers.json');
          if (!response.ok) throw new Error("Error al cargar el JSON");
          const juegos = await response.json();
          
          // Seleccionar 5 juegos específicos por nombre
          const nombresJuegos = ["ELDEN RING", "Baldur's Gate 3", "Palworld", "Cyberpunk 2077", "Counter-Strike 2"];
          const juegosSeleccionados = [];
          
          nombresJuegos.forEach(nombre => {
            const juego = juegos.find(j => j.name === nombre);
            if (juego) {
              juegosSeleccionados.push(juego);
            }
          });
          
          // Si no encontramos suficientes, agregamos los primeros disponibles
          if (juegosSeleccionados.length < 5) {
            const diferencia = 5 - juegosSeleccionados.length;
            for (let i = 0; i < diferencia && i < juegos.length; i++) {
              if (!juegosSeleccionados.some(j => j.appid === juegos[i].appid)) {
                juegosSeleccionados.push(juegos[i]);
              }
            }
          }
          
          // Guardar los IDs en localStorage
          const idsColeccion = juegosSeleccionados.map(j => j.appid);
          localStorage.setItem('coleccionJuegos', JSON.stringify(idsColeccion));
          console.log('Colección guardada en localStorage:', idsColeccion);
          
          // Renderizar los juegos
          const contenedor = document.getElementById('coleccion-juegos');
          if (contenedor) {
            contenedor.innerHTML = '';
            juegosSeleccionados.forEach(juego => {
              const imagenUrl = juego.header_image || `https://cdn.akamai.steamstatic.com/steam/apps/${juego.appid}/header.jpg`;
              const tarjeta = document.createElement('a');
              tarjeta.href = `/juego/${juego.appid}`;
              tarjeta.className = 'tarjeta';
              tarjeta.innerHTML = `
                <img src="${imagenUrl}" alt="${juego.name}">
                <div class="info-tarjeta">
                  <span class="titulo-juego">${juego.name}</span>
                  <div class="etiquetas">Instalado</div>
                </div>
              `;
              contenedor.appendChild(tarjeta);
            });
          }
        } catch (error) {
          console.error("Error al cargar la colección:", error);
        }
      };
      
      // Llamar la función
      cargarColeccionJuegos();

      // Lógica del Carrito (Simulada)
      const actualizarContadorCarrito = (cantidad) => {
        const badge = document.getElementById('badge-carrito');
        if (badge) {
          if (cantidad > 0) {
            badge.style.display = 'flex'; badge.textContent = cantidad;
          } else {
            badge.style.display = 'none';
          }
        }
      };
      actualizarContadorCarrito(2);

    });
  </script>
  <script src='/js/script.js'></script>
</body>
</html>
