<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego - Xyron</title>
<link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
<link rel="stylesheet" href="/estilos/index.css" />
<link rel="stylesheet" href="/estilos/juego.css" />
</head>
<body>

  <div class="contenedor-principal">
    
        <div id="sidebar-container"></div>

    <main class="contenido">
      <header class="barra-superior" style="display: flex; justify-content: flex-end; align-items: center; padding: 1rem;">
        <div class="boton-carrito">
          <a href="/carrito"><i class="fa-solid fa-cart-shopping"></i></a>
          <span class="contador-carrito" id="badge-carrito">0</span>
        </div>
      </header>

      <div class="scroll-contenido">
        <div class="contenedor-juego">
          <div class="galeria-juego">
            <div class="imagen-principal">
              <img src="https://picsum.photos/800/450?random=100" alt="Juego">
            </div>
            <div class="miniaturas" id="miniaturas-container">
              <img src="https://picsum.photos/200/120?random=101" alt="Miniatura 1" class="miniatura">
              <img src="https://picsum.photos/200/120?random=102" alt="Miniatura 2" class="miniatura">
              <img src="https://picsum.photos/200/120?random=103" alt="Miniatura 3" class="miniatura">
            </div>
            <div class="descripcion-juego">
              <p>Cargando descripción...</p>
            </div>
          </div>

          <aside class="info-juego">
            <h1 class="titulo-juego">Cargando...</h1>
            
            <div class="desarrollador-juego">
              <span>Desarrollador:</span>
              <a href="#">Por cargar</a>
            </div>

            <div class="etiquetas-juego">
              <span class="etiqueta">Acción</span>
              <span class="etiqueta">RPG</span>
              <span class="etiqueta">Mundo Abierto</span>
            </div>

            <div class="capturas-juego">
              <h3>Capturas</h3>
              <div class="grid-capturas" id="capturas-container">
                <img src="https://picsum.photos/300/170?random=104" alt="Captura">
                <img src="https://picsum.photos/300/170?random=105" alt="Captura">
                <img src="https://picsum.photos/300/170?random=106" alt="Captura">
                <img src="https://picsum.photos/300/170?random=107" alt="Captura">
              </div>
            </div>

            <div class="info-fecha">
              <div class="info-item">
                <span class="label">Fecha de lanzamiento:</span>
                <span class="value">Por cargar</span>
              </div>
            </div>

            <div class="precios">
              <span class="precio-original">79.99€</span>
              <span class="precio-descuento">-25%</span>
              <span class="precio-final">59.99€</span>
            </div>

            <div class="botones-compra">
              <button class="btn-comprar"><i class="fa-solid fa-cart-shopping"></i> Añadir al carrito</button>
              <button class="btn-deseados"><i class="fa-solid fa-heart"></i> Lista de deseados</button>
            </div>
          </aside>

        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // --- Lógica de Menús Desplegables ---
      // Simulación contador carrito
      const badge = document.getElementById('badge-carrito');
      if (badge) {
        badge.style.display = 'none';
      }

      function normalizePrice(price) {
        const p = Number(price) || 0;
        if (p >= 100 && Number.isInteger(p)) {
          return p / 100;
        }
        return p;
      }

      // CARGAR DATOS DEL JUEGO
      try {
        const pathParts = window.location.pathname.split('/').filter(p => p);
        const juegoAppId = parseInt(pathParts[pathParts.length - 1]);
        console.log('Buscando juego con ID:', juegoAppId);

        if (isNaN(juegoAppId) || juegoAppId <= 0) {
          document.querySelector('.titulo-juego').textContent = 'ID inválido';
          return;
        }

        // FETCH JSON
        const response = await fetch('/JSON/steam_top_1000_sellers.json');
        if (!response.ok) throw new Error('No se pudo cargar el JSON');

        const juegos = await response.json();
        console.log('Juegos cargados:', juegos.length);

        // BUSCAR JUEGO
        const juego = juegos.find(j => {
          return j && j.appid && Number(j.appid) === Number(juegoAppId);
        });

        if (!juego) {
          console.error('Juego no encontrado:', juegoAppId);
          document.querySelector('.titulo-juego').textContent = 'Juego no encontrado';
          return;
        }

        console.log('Juego encontrado:', juego.name);

        // RENDERIZAR DATOS
        document.querySelector('.titulo-juego').textContent = juego.name;
        document.title = `${juego.name} - Xyron`;

        const imgPrincipal = document.querySelector('.imagen-principal img');
        if (imgPrincipal) imgPrincipal.src = juego.header_image;

        const miniaturasContainer = document.querySelector('#miniaturas-container');
        if (juego.screenshots && juego.screenshots.length > 0) {
          const miniaturasHTML = juego.screenshots.slice(0, 3).map((src, idx) =>
            `<img src="${src}" alt="Miniatura ${idx + 1}" class="miniatura ${idx === 0 ? 'active' : ''}" loading="lazy">`
          ).join('');
          miniaturasContainer.innerHTML = miniaturasHTML;

          // Agregar eventos de click a las miniaturas
          document.querySelectorAll('.miniatura').forEach((img, index) => {
            img.addEventListener('click', () => {
              imgPrincipal.src = img.src;
              document.querySelectorAll('.miniatura').forEach(m => m.classList.remove('active'));
              img.classList.add('active');
            });
          });
        }

        const devLink = document.querySelector('.desarrollador-juego a');
        if (devLink && juego.developer) devLink.textContent = juego.developer;

        const etiquetasContainer = document.querySelector('.etiquetas-juego');
        if (juego.genres && juego.genres.length > 0) {
          etiquetasContainer.innerHTML = juego.genres.map(g =>
            `<span class="etiqueta">${g}</span>`
          ).join('');
        }

        const descContainer = document.querySelector('.descripcion-juego p');
        if (descContainer) descContainer.textContent = juego.description || 'Sin descripción';

        const gridCapturas = document.querySelector('#capturas-container');
        if (juego.screenshots && juego.screenshots.length > 3) {
          gridCapturas.innerHTML = juego.screenshots.slice(3, 7).map(src =>
            `<img src="${src}" alt="Captura" loading="lazy">`
          ).join('');
        } else if (juego.screenshots && juego.screenshots.length > 0) {
          gridCapturas.innerHTML = juego.screenshots.map(src =>
            `<img src="${src}" alt="Captura" loading="lazy">`
          ).join('');
        }

        const fechaElement = document.querySelector('.info-fecha .value');
        if (fechaElement) fechaElement.textContent = juego.release_date || 'Por confirmar';

        const price = juego.price || { final: 0, discount_percent: 0 };
        const finalPrice = normalizePrice(price.final);
        const discount = Number(price.discount_percent) || 0;

        const priceFinalElem = document.querySelector('.precio-final');
        const priceOriginalElem = document.querySelector('.precio-original');
        const discountElem = document.querySelector('.precio-descuento');

        if (priceFinalElem) {
          if (finalPrice === 0) {
            priceFinalElem.textContent = 'Gratis';
            if (priceOriginalElem) priceOriginalElem.style.display = 'none';
            if (discountElem) discountElem.style.display = 'none';
          } else {
            priceFinalElem.textContent = `${finalPrice.toFixed(2)}€`;
            if (discount > 0) {
              const original = finalPrice / (1 - discount / 100);
              if (priceOriginalElem) {
                priceOriginalElem.textContent = `${original.toFixed(2)}€`;
                priceOriginalElem.style.display = 'inline';
              }
              if (discountElem) {
                discountElem.textContent = `-${discount}%`;
                discountElem.style.display = 'inline';
              }
            } else {
              if (priceOriginalElem) priceOriginalElem.style.display = 'none';
              if (discountElem) discountElem.style.display = 'none';
            }
          }
        }

        // Funciones comunes carrito
        const CARRITO_KEY = 'solarSistemCart';

        function getCart() {
          return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
        }

        function saveCart(cart) {
          localStorage.setItem(CARRITO_KEY, JSON.stringify(cart));
          updateBadges();
        }

        function addToCart(juego) {
          let cart = getCart();
          const existing = cart.find(item => item.appid === juego.appid);
          if (existing) {
            // No permitir duplicados - el juego ya está en el carrito
            console.log('El juego ya está en el carrito');
            return false;
          } else {
            // Agregar con cantidad siempre = 1
            cart.push({
              appid: juego.appid,
              name: juego.name,
              header_image: juego.header_image,
              finalPrice: normalizePrice(juego.price?.final),
              quantity: 1
            });
          }
          saveCart(cart);
          return true;
        }

        function updateBadges() {
          const totalItems = getCart().length; // Contar solo items, no cantidad
          document.querySelectorAll('#badge-carrito').forEach(badge => {
            if (totalItems > 0) {
              badge.style.display = 'flex';
              badge.textContent = totalItems;
            } else {
              badge.style.display = 'none';
            }
          });
        }

        // Verificar si el juego ya está en la colección (desde el backend)
        let juegoEnColeccion = false;
        const usuario = typeof AUTH !== 'undefined' && AUTH ? AUTH.getAuthenticatedUser() : null;
        if (usuario && usuario.idUsuario) {
          try {
            const response = await fetch(`/api/coleccion/${usuario.idUsuario}`);
            if (response.ok) {
              const juegosColeccion = await response.json();
              juegoEnColeccion = juegosColeccion.some(j => Number(j.idJuego) === Number(juego.appid));
              console.log('Juego en colección (backend):', juegoEnColeccion);
            }
          } catch (e) {
            console.error('Error consultando colección:', e);
          }
        }

        // Bind buttons
        const btnComprar = document.querySelector('.btn-comprar');
        if (btnComprar && juego) {
          if (juegoEnColeccion) {
            // Si ya está en la colección, deshabilitar el botón
            btnComprar.disabled = true;
            btnComprar.innerHTML = '<i class="fa-solid fa-check"></i> Ya está en tu colección';
            btnComprar.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
            btnComprar.style.cursor = 'not-allowed';
            btnComprar.style.opacity = '0.7';
          } else {
            // Si no está, permitir la compra
            btnComprar.onclick = () => {
              const added = addToCart(juego);
              if (added) {
                btnComprar.textContent = '✓ Añadido';
                btnComprar.style.background = '#28a745';
                btnComprar.disabled = true;
                setTimeout(() => {
                  btnComprar.textContent = 'Añadir al carrito';
                  btnComprar.style.background = '';
                  btnComprar.disabled = false;
                }, 2000);
              } else {
                // Juego ya está en el carrito
                alert('Este juego ya está en tu carrito');
              }
            };
          }
        }

        const btnDeseados = document.querySelector('.btn-deseados');
        if (btnDeseados) {
          // Verificar si el juego ya está en deseados al cargar
          const listaDeseadosInit = JSON.parse(localStorage.getItem('listaDeseados')) || [];
          const estaEnDeseados = listaDeseadosInit.includes(juego.appid);

          if (estaEnDeseados) {
            btnDeseados.innerHTML = '<i class="fa-solid fa-heart"></i> Quitar de deseados';
            btnDeseados.style.background = '#ffc107';
          }

          btnDeseados.onclick = () => {
            // Obtener la lista actual de deseados
            const listaDeseados = JSON.parse(localStorage.getItem('listaDeseados')) || [];

            // Verificar si ya está en la lista
            if (!listaDeseados.includes(juego.appid)) {
              // Agregar a deseados
              listaDeseados.push(juego.appid);
              localStorage.setItem('listaDeseados', JSON.stringify(listaDeseados));
              btnDeseados.innerHTML = '<i class="fa-solid fa-check"></i> Añadido a deseados';
              btnDeseados.style.background = '#ffc107';
              setTimeout(() => {
                btnDeseados.innerHTML = '<i class="fa-solid fa-heart"></i> Quitar de deseados';
                btnDeseados.style.background = '#ffc107';
              }, 2000);
            } else {
              // Eliminar de deseados
              const listaActualizada = listaDeseados.filter(id => id !== juego.appid);
              localStorage.setItem('listaDeseados', JSON.stringify(listaActualizada));
              btnDeseados.innerHTML = '<i class="fa-solid fa-trash"></i> Eliminado';
              btnDeseados.style.background = '#dc3545';
              setTimeout(() => {
                btnDeseados.innerHTML = '<i class="fa-solid fa-heart"></i> Añadir a deseados';
                btnDeseados.style.background = '';
              }, 2000);
            }
          };
        }

        // Init badge
        updateBadges();
        console.log('✅ Juego cargado correctamente');

      } catch (error) {
        console.error('Error:', error);
        document.querySelector('.titulo-juego').textContent = 'Error: ' + error.message;
      }
    });
  </script>

  <script src='/js/script.js'></script>
</body>
</html>
