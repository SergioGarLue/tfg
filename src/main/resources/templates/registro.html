<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse </title>
    <link rel="stylesheet" href="/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="/estilos/registro.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-box">
            <div class="logo-section">
                <div class="logo">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <h1>CREAR CUENTA</h1>
                <p class="subtitle">Únete a nuestra comunidad</p>
            </div>

            <form id="registro-form" class="registro-form">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>
                    </div>
                    <span class="help-text">Mínimo 4 caracteres, máximo 16</span>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                    </div>
                    <span class="help-text">Mínimo 8 caracteres: mayúscula, minúscula, número y carácter especial</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <div id="error-message" class="error-message" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text"></span>
                </div>

                <div id="success-message" class="success-message" style="display: none;">
                    <i class="fa-solid fa-check-circle"></i>
                    <span id="success-text"></span>
                </div>

                <button type="submit" class="btn-registro">CREAR CUENTA</button>
            </form>

            <div class="login-link">
                <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a></p>
            </div>
        </div>

        <div class="background-glow"></div>
    </div>

    <!-- Scripts de autenticación -->
    <script src="/js/auth.js"></script>
    <script src="/js/fetch-interceptor.js"></script>
    <script src="/js/route-protection.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Si ya está autenticado, redirigir a inicio
            if (AUTH.isAuthenticated()) {
                window.location.href = '/';
            }

            const form = document.getElementById('registro-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();
                const errorDiv = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');
                const successDiv = document.getElementById('success-message');
                const successText = document.getElementById('success-text');

                // Validaciones básicas
                if (password !== confirmPassword) {
                    errorDiv.style.display = 'flex';
                    errorText.textContent = 'Las contraseñas no coinciden';
                    return;
                }

                if (username.length < 4 || username.length > 16) {
                    errorDiv.style.display = 'flex';
                    errorText.textContent = 'El nombre de usuario debe tener entre 4 y 16 caracteres';
                    return;
                }

                try {
                    errorDiv.style.display = 'none';
                    successDiv.style.display = 'none';

                    const result = await AUTH.register(username, email, password);
                    
                    successDiv.style.display = 'flex';
                    successText.textContent = result || 'Registro exitoso. Redirigiendo a login...';

                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } catch (error) {
                    console.error('Error en registro:', error);
                    errorDiv.style.display = 'flex';
                    errorText.textContent = error.message || 'Error al registrar. Intenta de nuevo.';
                }
            });
        });
    </script>
</body>
</html>
