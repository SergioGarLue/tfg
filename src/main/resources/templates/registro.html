<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse </title>
    <link rel="stylesheet" href="../static/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="../static/estilos/registro.css">
</head>
<body>
    <div class="registro-container">
        <div class="registro-box">
            <div class="logo-section">
                <div class="logo">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <h1>CREAR CUENTA</h1>
                <p class="subtitle">Únete </p>
            </div>

            <form class="registro-form" th:action="@{/registro}" th:object="${usuarioDTO}" method="post">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" th:field="*{username}" placeholder="Elige un nombre de usuario" required>
                    </div>
                    <span class="help-text">Mínimo 4 caracteres, máximo 8</span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" th:field="*{passwd}" placeholder="Crea una contraseña" required>
                    </div>
                    <span class="help-text">Mínimo 8 caracteres: mayúscula, minúscula, número y carácter especial</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <div class="error-message" th:if="${error}">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${error}"></span>
                </div>

                <div class="success-message" th:if="${success}">
                    <i class="fa-solid fa-check-circle"></i>
                    <span th:text="${success}"></span>
                </div>

                <button type="submit" class="btn-registro">CREAR CUENTA</button>
            </form>

            <div class="login-link">
                <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
            </div>
        </div>

        <div class="background-glow"></div>
    </div>
</body>
</html>
