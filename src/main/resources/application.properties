spring.application.name=tfg

# ===============================
# Configuración de la base de datos
# ===============================
spring.datasource.url=jdbc:h2:mem:tfgdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true

# ===============================  
# Configuración de Stripe
# ===============================
stripe.key.secret=${STRIPE_SECRET_KEY:sk_test_your_secret_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
spring.h2.console.path=/h2-console

# Opcional: Deshabilitar Open-in-View warning
spring.jpa.open-in-view=false

# Ejecutar script SQL de datos al iniciar
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ===============================
# JWT Configuration (Dev only)
# ===============================
jwt.secret=yourVeryLongSecretKeyForDevChangeInProductionAtLeast32Chars12345678901234567890
jwt.access.expiration=900000
# Access token 15 min
jwt.refresh.expiration=604800000
# Refresh token 7 days

